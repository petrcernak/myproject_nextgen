services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: myproject2_app
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-myproject2}
      DB_USER: ${DB_USER:-appuser}
      DB_PASS: ${DB_PASS:-secret}
    networks:
      - app_network

  db:
    image: postgres:13-alpine
    container_name: myproject2_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-myproject2}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASS:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
